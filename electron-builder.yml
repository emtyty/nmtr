appId: com.nmtr.app
productName: nmtr
copyright: "Copyright © 2024"

directories:
  buildResources: build
  output: dist-release

compression: maximum

afterPack: build/afterPack.js

files:
  - out/**/*
  - "!out/**/*.map"
  - package.json
  - node_modules/pingus/**/*
  - "!node_modules/pingus/src/**/*"
  - node_modules/raw-socket/**/*
  - "!node_modules/raw-socket/src/**/*"
  - "!node_modules/raw-socket/build/raw.vcxproj"
  - "!node_modules/raw-socket/build/raw.vcxproj.filters"
  - "!node_modules/raw-socket/build/Release/obj/**/*"
  - "!node_modules/raw-socket/build/Release/*.iobj"
  - "!node_modules/raw-socket/build/Release/*.ipdb"
  - "!node_modules/raw-socket/build/Release/*.pdb"
  - node_modules/@amuject/**/*
  - node_modules/koffi/**/*
  - "!node_modules/koffi/src/**/*"
  - "!node_modules/koffi/doc/**/*"
  - "!node_modules/koffi/lib/native/**/*"
  - "!node_modules/koffi/vendor/**/*"
  - "!node_modules/koffi/build/koffi/darwin_*/**/*"
  - "!node_modules/koffi/build/koffi/linux_*/**/*"
  - "!node_modules/koffi/build/koffi/musl_*/**/*"
  - "!node_modules/koffi/build/koffi/freebsd_*/**/*"
  - "!node_modules/koffi/build/koffi/openbsd_*/**/*"
  - "!node_modules/koffi/build/koffi/win32_arm64/**/*"
  - "!node_modules/koffi/build/koffi/win32_ia32/**/*"
  - node_modules/p-queue/**/*
  - node_modules/p-limit/**/*
  - node_modules/electron-store/**/*
  - node_modules/lru-cache/**/*

  # Renderer-only packages — bundled into out/renderer/assets/index-*.js by Vite,
  # so the source node_modules entries are pure dead weight in the asar.
  - "!node_modules/@radix-ui/**/*"
  - "!node_modules/@xyflow/**/*"
  - "!node_modules/@floating-ui/**/*"
  - "!node_modules/@reach/**/*"
  - "!node_modules/@babel/**/*"
  - "!node_modules/react/**/*"
  - "!node_modules/react-dom/**/*"
  - "!node_modules/react-is/**/*"
  - "!node_modules/react-virtual/**/*"
  - "!node_modules/react-simple-maps/**/*"
  - "!node_modules/react-smooth/**/*"
  - "!node_modules/react-style-singleton/**/*"
  - "!node_modules/react-transition-group/**/*"
  - "!node_modules/react-remove-scroll/**/*"
  - "!node_modules/recharts/**/*"
  - "!node_modules/tailwind-merge/**/*"
  - "!node_modules/world-atlas/**/*"
  - "!node_modules/zustand/**/*"
  - "!node_modules/clsx/**/*"
  - "!node_modules/prop-types/**/*"
  - "!node_modules/scheduler/**/*"
  - "!node_modules/victory-vendor/**/*"
  - "!node_modules/d3-*/**/*"
  - "!node_modules/internmap/**/*"
  - "!node_modules/topojson-client/**/*"
  - "!node_modules/csstype/**/*"
  - "!node_modules/aria-hidden/**/*"
  - "!node_modules/classcat/**/*"
  - "!node_modules/decimal.js-light/**/*"
  - "!node_modules/detect-node-es/**/*"
  - "!node_modules/dom-helpers/**/*"
  - "!node_modules/get-nonce/**/*"
  - "!node_modules/tiny-invariant/**/*"
  - "!node_modules/tiny-typed-emitter/**/*"
  - "!node_modules/fast-equals/**/*"
  - "!node_modules/loose-envify/**/*"
  - "!node_modules/js-tokens/**/*"
  - "!node_modules/object-assign/**/*"
  - "!node_modules/use-callback-ref/**/*"
  - "!node_modules/use-sidecar/**/*"
  - "!node_modules/use-sync-external-store/**/*"
  - "!node_modules/lodash/**/*"

  # Declared in dependencies but not imported by main process
  - "!node_modules/ndjson/**/*"

  # Build-time only — not needed by the runtime
  - "!node_modules/nan/**/*"
  - "!node_modules/type-fest/**/*"

extraResources:
  - from: resources/
    to: .
    filter: ["tray-icon.png"]

asar: true
asarUnpack:
  - node_modules/pingus/**/*
  - node_modules/raw-socket/**/*
  - node_modules/@amuject/**/*
  - node_modules/koffi/**/*

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  requestedExecutionLevel: requireAdministrator

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: nmtr

publish:
  provider: github
  owner: placeholder
  repo: nmtr
  releaseType: release
