name: Prune R2 (manual)

# Manually trigger the R2 release pruner — e.g. to test the logic or to
# clean up after a botched release. Defaults to a DRY RUN: it prints what
# WOULD be deleted without touching the bucket. Flip dry_run to "false" to
# actually delete.
#
# Run from: Actions tab -> "Prune R2 (manual)" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      keep:
        description: 'Number of newest versions to retain'
        required: true
        default: '2'
        type: string
      dry_run:
        description: 'Dry run (print only, delete nothing)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  prune:
    environment: Production
    name: Prune R2 releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run pruner
        run: bash scripts/prune-r2-releases.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          R2_RELEASES_ACCOUNT_ID: ${{ secrets.R2_RELEASES_ACCOUNT_ID }}
          R2_RELEASES_BUCKET: ${{ secrets.R2_RELEASES_BUCKET }}
          KEEP: ${{ inputs.keep }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
